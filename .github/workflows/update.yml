name: update-feed
on:
  schedule:
    - cron: "0 14 * * 1,3" # Mondays and Wednesdays 14:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: PYTHONPATH=src uv run python tests/test_fwbc_rss.py
      - run: PYTHONPATH=src uv run python src/fwbc_rss.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add feed.xml
          git diff --cached --quiet || git commit -m "Update feed" && git push
